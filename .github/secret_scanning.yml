# Varredura de segredos do GitHub: ignora só o arquivo com as chaves PÚBLICAS do
# Firebase (apiKey web e chave do site do reCAPTCHA). Elas não são segredos: vão
# para o navegador de todo visitante. A proteção são as regras do Firestore, a
# restrição de domínio/API da chave e o App Check (ver README, seção Segurança).
# O restante do repositório continua sendo verificado normalmente.
paths-ignore:
  - "js/infra/firebase/config.js"
