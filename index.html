<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Segurança (CSP): o navegador só carrega scripts deste site e do Firebase
       (gstatic/apis.google.com), o reCAPTCHA (www.google.com) e só conversa com os
       serviços do Google. Se um dia
       surgir uma falha de XSS, script de outro site não roda nem envia dados.
       Ao adicionar um serviço externo, libere o domínio aqui. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com;
    connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://apis.google.com https://www.google.com;
    frame-src https://daggerborg-sheets.firebaseapp.com https://accounts.google.com https://www.google.com;
    img-src 'self' data: blob:;
    style-src 'self';
    font-src 'self';
    manifest-src 'self';
    worker-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Dagger Sheet</title>
  <meta name="description" content="Crie e gerencie fichas de personagem de RPG, mesmo offline.">

  <!-- PWA: manifesto e cor da barra do sistema -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6d28d9">

  <!-- iOS: ícone e modo "app" ao adicionar à tela inicial -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="topo">
    <a class="topo__marca" href="#/">Dagger Sheet</a>
    <nav class="abas" aria-label="Seções">
      <a class="abas__item" href="#/" data-aba="fichas">Fichas</a>
      <a class="abas__item" href="#/campanhas" data-aba="campanhas">Campanhas</a>
    </nav>
    <div class="topo__acoes">
      <div id="conta"></div>
      <button id="btn-instalar" class="botao botao--pequeno botao--claro" hidden>Instalar</button>
      <span id="status-rede" class="status">online</span>
    </div>
  </header>

  <!-- As páginas são desenhadas aqui pelo router -->
  <main id="app" class="conteudo" aria-live="polite"></main>

  <!-- Aviso exigido pelo Google ao esconder o selo flutuante do reCAPTCHA -->
  <footer class="rodape">
    <small>
      Login e nuvem protegidos pelo reCAPTCHA do Google:
      <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">Privacidade</a> e
      <a href="https://policies.google.com/terms" target="_blank" rel="noopener noreferrer">Termos</a>.
    </small>
  </footer>

  <noscript>Este app precisa de JavaScript ativado.</noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
