<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Segurança (CSP): o navegador só carrega scripts deste site e do Firebase
       (gstatic/apis.google.com), o reCAPTCHA (www.google.com) e só conversa com os
       serviços do Google. Se um dia
       surgir uma falha de XSS, script de outro site não roda nem envia dados.
       Ao adicionar um serviço externo, libere o domínio aqui. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com;
    connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://apis.google.com https://www.google.com;
    frame-src https://daggerborg-sheets.firebaseapp.com https://accounts.google.com https://www.google.com;
    img-src 'self' data: blob:;
    style-src 'self';
    font-src 'self';
    manifest-src 'self';
    worker-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Dagger Sheet</title>
  <meta name="description" content="Crie e gerencie fichas de personagem de RPG, mesmo offline.">

  <!-- PWA: manifesto e cor da barra do sistema (ajustada pelo tema) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e0c14">

  <!-- Tema salvo aplicado antes de pintar a página (evita "piscar" o tema errado) -->
  <script src="js/theme-boot.js"></script>

  <!-- iOS: ícone e modo "app" ao adicionar à tela inicial -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <!-- Casca do app (js/ui/shell.js). No celular: barra superior com voltar +
       título e navegação na parte de baixo. No desktop: marca + navegação no topo. -->
  <header class="barra-topo">
    <div class="barra-topo__interno">
      <button id="btn-voltar" class="botao-icone barra-topo__voltar" type="button" aria-label="Voltar" hidden>
        <span data-icone="arrow-left"></span>
      </button>
      <a class="marca" href="#/">Dagger Sheet</a>
      <span id="titulo-tela" class="barra-topo__titulo"></span>

      <nav class="nav-topo" aria-label="Seções">
        <a class="nav-topo__item" href="#/" data-aba="fichas"><span data-icone="scroll-text"></span>Fichas</a>
        <a class="nav-topo__item" href="#/campanhas" data-aba="campanhas"><span data-icone="users"></span>Campanhas</a>
        <a class="nav-topo__item" href="#/perfil" data-aba="perfil"><span data-icone="user"></span>Perfil</a>
      </nav>

      <div class="barra-topo__acoes">
        <span id="status-rede" class="status" hidden><span data-icone="wifi-off"></span>Offline</span>
        <button id="btn-instalar" class="botao botao--pequeno botao--instalar" aria-label="Instalar o app" hidden>
          <span data-icone="download"></span><span class="so-desktop">Instalar</span>
        </button>
        <!-- Conta: "Entrar" ou avatar (js/ui/components/headerAccount.js) -->
        <div id="conta-topo" class="conta-topo"></div>
      </div>
    </div>
  </header>

  <!-- As páginas são desenhadas aqui pelo router -->
  <main id="app" class="conteudo" aria-live="polite"></main>

  <!-- Aviso exigido pelo Google ao esconder o selo flutuante do reCAPTCHA -->
  <footer class="rodape">
    <small>
      Login e nuvem protegidos pelo reCAPTCHA do Google:
      <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">Privacidade</a> e
      <a href="https://policies.google.com/terms" target="_blank" rel="noopener noreferrer">Termos</a>.
    </small>
  </footer>

  <!-- Navegação inferior (celular), como num app -->
  <nav class="nav-inferior" aria-label="Seções">
    <a class="nav-inferior__item" href="#/" data-aba="fichas">
      <span data-icone="scroll-text"></span><span>Fichas</span>
    </a>
    <a class="nav-inferior__item" href="#/campanhas" data-aba="campanhas">
      <span data-icone="users"></span><span>Campanhas</span>
    </a>
    <a class="nav-inferior__item" href="#/perfil" data-aba="perfil">
      <span data-icone="user"></span><span>Perfil</span>
    </a>
  </nav>

  <noscript>Este app precisa de JavaScript ativado.</noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
